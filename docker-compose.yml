services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgres://atlus:atlus@db:5432/atlus
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: atlus
      POSTGRES_PASSWORD: atlus
      POSTGRES_DB: atlus
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlus -d atlus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
