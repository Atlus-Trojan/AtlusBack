services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: log
      DATABASE_URL: postgres://atlus:Atlus%40456@db:5432/atlus
      JWT_SECRET: local-dev-secret-change-me-32chars
      JWT_EXPIRATION: 1d
      CPF_ENCRYPTION_KEY: '00000000000000000000000000000000'
      EMAIL_OTP_PROVIDER_KEY: local-dev-otp-provider-key
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: atlus
      POSTGRES_PASSWORD: Atlus@456
      POSTGRES_DB: atlus
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlus -d atlus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
